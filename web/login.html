<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>J4FN MUSIC · Sign in</title>
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/login.js" defer></script>
</head>
<body class="admin-page">
  <div class="ambient ambient-one"></div>
  <div class="site-shell">
    <nav class="topbar">
      <a class="brand" href="/"><span class="brand-mark"><img src="/assets/favicon.png" alt=""></span><span><strong>J4FN ADMIN</strong><small>Protected operations console</small></span></a>
      <div class="nav-links"><a href="/">← Public status</a></div>
    </nav>

    <main>
      <section class="login-shell">
        <div class="login-card">
          <span class="lock-icon">⌁</span>
          <h1>Admin sign in</h1>
          <p class="login-lead">Choose how you want to authenticate.</p>

          <!-- /admin/ is inside the Cloudflare Access application, so simply requesting
               it makes Cloudflare present its own login and hand the identity to the
               console. This page stays outside that application so the token option
               below remains reachable. -->
          <a class="button button-primary login-primary" href="/admin/">Sign in with Cloudflare Access</a>

          <span class="unlock-or">or enter admin token</span>

          <form id="login-form" autocomplete="on">
            <label class="sr-only" for="admin-token">Admin token</label>
            <input id="admin-token" type="password" autocomplete="current-password" placeholder="Admin token" required>
            <button class="button button-quiet" type="submit" id="login-submit">Unlock</button>
          </form>
          <p class="form-message" id="login-message" role="status"></p>
        </div>
      </section>
    </main>

    <footer><span class="footer-brand"><img src="/assets/favicon.png" alt="">J4FN MUSIC / ADMIN</span></footer>
  </div>
</body>
</html>
