# fly.toml app configuration file generated for discord-music-bot-j4fn on 2026-05-21T19:34:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'discord-music-bot-j4fn'
primary_region = 'sin'

[build]

[env]
  NODE_ENV = 'production'

[[mounts]]
  source = 'bot_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[restart]]
  policy = 'always'
  retries = 5

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
