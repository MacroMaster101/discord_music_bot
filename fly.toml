# J4FN Music Bot — Fly.io Configuration
#
# Setup:    fly apps create <your-app-name>
# Secrets:  fly secrets set TOKEN=your_discord_token PREFIX=!
# Deploy:   fly deploy
# Logs:     fly logs
# Status:   fly status

app = 'discord-music-bot-lukt4g'
primary_region = 'sin'

[build]
  # Uses the Dockerfile in the project root

[env]
  NODE_ENV = 'production'

# No [http_service] — this is a Discord bot (background worker),
# not a web application. It connects outbound to Discord's gateway.
# Without an HTTP service, Fly.io will NOT auto-stop the machine.

# Restart the bot automatically if it crashes
[restart]
  policy = 'always'
  max_retries = 5

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
