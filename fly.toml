# fly.toml app configuration file generated for discord-music-bot-lukt4g on 2026-05-21T02:19:59Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'discord-music-bot-lukt4g'
primary_region = 'sin'

[build]
  # Uses the Dockerfile in the project root

[env]
  NODE_ENV = 'production'

# Expose the HTTP service for the web dashboard on port 8080.
# We set auto_stop_machines to 'off' so Fly.io never halts the bot when idle,
# ensuring it remains active 24/7 in Discord voice channels.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

# Restart the bot automatically if it crashes

[restart]
  policy = 'always'
  max_retries = 5

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  memory = '512mb'
  size = 'shared-cpu-1x'
