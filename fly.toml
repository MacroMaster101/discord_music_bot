# J4FN Music Bot — Fly.io Configuration
#
# Setup:    fly apps create <your-app-name>
# Secrets:  fly secrets set TOKEN=your_discord_token PREFIX=!
# Deploy:   fly deploy
# Logs:     fly logs
# Status:   fly status

app = 'discord-music-bot-lukt4g'
primary_region = 'sin'

[build]
  # Uses the Dockerfile in the project root

[env]
  NODE_ENV = 'production'

# Expose the HTTP service for the web dashboard on port 8080.
# We set auto_stop_machines to 'off' so Fly.io never halts the bot when idle,
# ensuring it remains active 24/7 in Discord voice channels.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

# Restart the bot automatically if it crashes
[restart]
  policy = 'always'
  max_retries = 5

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
