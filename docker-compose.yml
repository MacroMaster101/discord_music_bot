services:
  bot:
    build:
      context: .
      args:
        BGUTIL_VERSION: ${BGUTIL_VERSION:-1.3.1}
    container_name: discord-music-bot
    restart: unless-stopped
    depends_on:
      bgutil-provider:
        condition: service_healthy
    ports:
      # Keep 0.0.0.0 only during the tunnel migration. Production should set
      # DASHBOARD_BIND_ADDRESS=127.0.0.1 and use Cloudflare Tunnel.
      - "${DASHBOARD_BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}:${PORT:-8080}"
    environment:
      YTDLP_COOKIES_PATH: /app/data/cookies.txt
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${PORT:-8080}/healthz').then(r=>{if(r.status!==200)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:${BGUTIL_VERSION:-1.3.1}
    container_name: bgutil-provider
    restart: unless-stopped
    # Provider listens on 4416 inside the compose network.
    # Not published to the host — only the bot needs to reach it.
    expose:
      - "4416"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4416/ping').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-latest}
    container_name: j4fn-cloudflared
    profiles:
      - tunnel
    restart: unless-stopped
    depends_on:
      bot:
        condition: service_healthy
    # The route is managed in Cloudflare: music.j4fn.site -> http://bot:8080.
    # TUNNEL_TOKEN stays in the server .env file and is never committed.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
