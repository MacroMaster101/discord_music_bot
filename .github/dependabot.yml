version: 2
updates:
  # Version PRs target dev explicitly. Security PRs always open against the
  # default branch (main); .github/workflows/dependabot-to-dev.yml moves them to dev.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Colombo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @discordjs/voice's prism-media accepts only opusscript ^0.0.8.
      - dependency-name: opusscript
        versions: ['>=0.1.0']

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Colombo
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(actions)
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Colombo
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(docker)
    ignore:
      # Stay on the Node LTS line that CI tests (22). Major runtime moves are
      # made by hand together with the CI node-version.
      - dependency-name: node
        update-types: ['version-update:semver-major']
