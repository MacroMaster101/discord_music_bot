version: 2
updates:
  # Version PRs target dev explicitly. Security PRs also target dev because
  # dev is the repository's default branch; main remains production only.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Colombo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Colombo
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(actions)
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Colombo
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(docker)
