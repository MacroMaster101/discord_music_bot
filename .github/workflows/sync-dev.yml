name: Sync main into dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-main-into-dev
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out dev
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: dev
          fetch-depth: 0
      - name: Keep dev up to date without rewriting history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main dev
            git merge --no-edit origin/dev
            git merge --no-edit origin/main
            if git push origin HEAD:dev; then
              exit 0
            fi
            echo "dev advanced during synchronization; retrying ($attempt/3)."
          done
          echo 'Could not synchronize dev. Merge main into dev manually to resolve conflicts.'
          exit 1
