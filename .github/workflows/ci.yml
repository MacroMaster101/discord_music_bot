name: Verify

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  branch-policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check pull request direction
        run: node scripts/check-branch-flow.js

  test:
    needs: branch-policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: "1"

      - name: Check JavaScript syntax
        run: npm run check

      - name: Verify native Opus installation
        run: node -e "require('@discordjs/opus')"

      - name: Run tests
        run: npm test

  # After a release, bring dev up to the commit main just verified. dev requires
  # the test and branch-policy checks, so this runs only once they have passed
  # on that exact commit; a fast-forward then satisfies the dev ruleset.
  sync-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: sync-main-into-dev
      cancel-in-progress: false
    steps:
      - name: Check out dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
      - name: Fast-forward dev to the verified main commit
        run: |
          git fetch origin dev
          git merge --ff-only "$GITHUB_SHA" || {
            echo "dev has commits that are not on main yet. Merge main into dev manually (admins bypass the dev checks), then promote again."
            exit 1
          }
          git push origin HEAD:dev
