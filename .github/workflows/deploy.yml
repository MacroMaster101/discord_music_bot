name: Deploy Bot to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          YTDLP_COOKIES_BASE64: ${{ secrets.YTDLP_COOKIES_BASE64 }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: YTDLP_COOKIES_BASE64
          command_timeout: 15m
          script_stop: true
          script: |
            set -eu
            cd ~/discord_music_bot
            attempt=1
            until git pull --ff-only origin main; do
              if [ "$attempt" -ge 3 ]; then
                echo "git pull failed after 3 attempts"
                exit 1
              fi
              echo "git pull failed; retrying in 5 seconds..."
              attempt=$((attempt + 1))
              sleep 5
            done
            install -d -m 700 data
            if [ -n "${YTDLP_COOKIES_BASE64:-}" ]; then
              printf '%s' "$YTDLP_COOKIES_BASE64" | base64 --decode > data/cookies.txt
              chmod 600 data/cookies.txt
            fi
            docker compose up -d --build
            sleep 5
            docker compose ps
            docker compose logs --tail=50 bot
            test "$(docker inspect --format '{{.State.Running}}' discord-music-bot)" = "true"
