name: Deploy Bot to AWS EC2

on:
  push:
    branches:
      - main
    # Docs never reach the image (see .dockerignore), so skip the deploy.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: 'Full rebuild: fresh base image and packages, no build cache, restart every container'
        type: boolean
        default: false
  schedule:
    # Nightly at 03:00 Sri Lanka time the server decides whether the weekly
    # full rebuild is due and nobody is listening (see the deploy script).
    - cron: '30 21 * * *'

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: "1"
      - name: Check JavaScript syntax
        run: npm run check
      - name: Verify native Opus installation
        run: node -e "require('@discordjs/opus')"
      - name: Run tests
        run: npm test

  deploy:
    needs: verify
    # The server always deploys origin/main, whichever ref a manual run picks.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://music.j4fn.site

    steps:
      - name: Find the newest yt-dlp nightly
        id: ytdlp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/yt-dlp/yt-dlp-nightly-builds/releases/latest --jq .tag_name || true)"
          case "$tag" in
            '' | *[!0-9.]*)
              echo "::warning::Could not read the newest yt-dlp nightly tag; the image keeps its cached yt-dlp."
              tag=latest
              ;;
          esac
          echo "yt-dlp nightly: $tag"
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          YTDLP_COOKIES_BASE64: ${{ secrets.YTDLP_COOKIES_BASE64 }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          YTDLP_VERSION: ${{ steps.ytdlp.outputs.version }}
          FULL_REBUILD: ${{ inputs.full_rebuild == true }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: YTDLP_COOKIES_BASE64,CLOUDFLARE_TUNNEL_TOKEN,YTDLP_VERSION,FULL_REBUILD,SCHEDULED
          command_timeout: 15m
          script: |
            set -eu
            cd ~/discord_music_bot
            # Weekly full rebuild, only while nobody is listening. The nightly
            # run rebuilds once 7 days have passed since the last full rebuild
            # and no room is playing. Defer if activity cannot be checked;
            # only an explicit manual full rebuild may interrupt listeners.
            full_state=.git/last-full-rebuild
            if [ "${SCHEDULED:-false}" = "true" ]; then
              now_s="$(date +%s)"
              last_full="$(cat "$full_state" 2>/dev/null || true)"
              case "$last_full" in
                '' | *[!0-9]*) last_full=$((now_s - 7 * 86400)) ;;
              esac
              age_days=$(((now_s - last_full) / 86400))
              if [ "$age_days" -lt 7 ]; then
                echo "Weekly rebuild not due: the last full rebuild was $age_days day(s) ago."
                exit 0
              fi
              port="$(grep -E '^PORT=[0-9]+$' .env | tail -n 1 | cut -d = -f 2 || true)"
              listening="$(docker exec discord-music-bot node -e "fetch('http://127.0.0.1:${port:-8080}/api/public/status', { signal: AbortSignal.timeout(5000) }).then((r) => { if (!r.ok) throw new Error('Status unavailable'); return r.json(); }).then((d) => { if (!Array.isArray(d.activeTracks)) throw new Error('Activity unavailable'); console.log(d.activeTracks.length); }).catch(() => { process.exitCode = 1; })" 2>/dev/null || true)"
              case "$listening" in
                '' | *[!0-9]*)
                  echo "Cannot confirm the bot is idle. Trying the weekly rebuild again tomorrow night."
                  exit 0
                  ;;
              esac
              if [ "$listening" -gt 0 ]; then
                echo "Weekly rebuild is due, but music is playing in $listening room(s). Trying again tomorrow night."
                exit 0
              fi
              echo "Weekly rebuild: $age_days day(s) since the last one, $listening room(s) playing."
              FULL_REBUILD=true
            fi
            before="$(git rev-parse HEAD)"
            attempt=1
            until git pull --ff-only origin main; do
              if [ "$attempt" -ge 3 ]; then
                echo "git pull failed after 3 attempts"
                exit 1
              fi
              echo "git pull failed; retrying in 5 seconds..."
              attempt=$((attempt + 1))
              sleep 5
            done
            echo "Commits in this deploy:"
            git log --oneline "$before..HEAD"
            test -f .env
            chmod 600 .env
            if ! grep -Eq '^ADMIN_TOKEN=.{24,}$' .env; then
              echo "ADMIN_TOKEN must be set to at least 24 characters in the server .env"
              exit 1
            fi
            install -d -m 700 data
            if [ -n "${YTDLP_COOKIES_BASE64:-}" ]; then
              printf '%s' "$YTDLP_COOKIES_BASE64" | base64 --decode > data/cookies.txt
              chmod 600 data/cookies.txt
            fi
            if [ -n "${CLOUDFLARE_TUNNEL_TOKEN:-}" ]; then
              # Keep the operator's lines (without trailing blank lines) and
              # append the managed keys, so the same token writes the same
              # bytes. Replace .env only when it actually changes.
              env_tmp="$(mktemp)"
              grep -v -E '^(TUNNEL_TOKEN|COMPOSE_PROFILES|DASHBOARD_BIND_ADDRESS)=' .env \
                | awk 'length($0) { while (blank > 0) { print ""; blank-- } print; next } { blank++ }' > "$env_tmp" || true
              printf '\nTUNNEL_TOKEN=%s\nCOMPOSE_PROFILES=tunnel\nDASHBOARD_BIND_ADDRESS=127.0.0.1\n' "$CLOUDFLARE_TUNNEL_TOKEN" >> "$env_tmp"
              if cmp -s "$env_tmp" .env; then
                rm -f "$env_tmp"
              else
                chmod 600 "$env_tmp"
                mv "$env_tmp" .env
              fi
            fi
            # The bot reads the bind-mounted .env only at startup, so restart it
            # when .env differs from the last successful deploy. The hash lives
            # in .git, which git ignores and the image never contains.
            env_state=.git/deployed-env.sha256
            env_hash="$(sha256sum .env | cut -d ' ' -f 1)"
            env_changed=""
            if [ "$(cat "$env_state" 2>/dev/null || true)" != "$env_hash" ]; then
              env_changed=1
            fi
            build_args="--build-arg YTDLP_VERSION=${YTDLP_VERSION:-latest}"
            if [ "${FULL_REBUILD:-false}" = "true" ]; then
              echo "Full rebuild: fresh base image and packages, every container restarts"
              if grep -q '^COMPOSE_PROFILES=.*tunnel' .env; then
                docker compose pull bgutil-provider cloudflared
              else
                docker compose pull bgutil-provider
              fi
              docker compose build --pull --no-cache $build_args bot
              docker compose up -d --remove-orphans --force-recreate
            else
              # Cached build: only layers whose inputs changed are rebuilt (app
              # code, package files, or a new yt-dlp nightly). Compose then
              # recreates only containers whose image or settings changed, so
              # cloudflared and the PO-token provider keep running.
              docker compose build $build_args bot
              if [ -n "$env_changed" ]; then
                echo ".env changed since the last deploy; restarting the bot"
                docker compose up -d --force-recreate bot
              fi
              docker compose up -d --remove-orphans
            fi
            health="starting"
            for _ in $(seq 1 48); do
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' discord-music-bot 2>/dev/null || true)"
              if [ "$health" = "healthy" ]; then
                break
              fi
              if [ "$health" = "unhealthy" ]; then
                docker compose logs --tail=100 bot
                echo "Bot container became unhealthy"
                exit 1
              fi
              sleep 5
            done
            docker compose ps
            docker compose logs --tail=50 bot
            test "$(docker inspect --format '{{.State.Running}}' discord-music-bot)" = "true"
            test "$health" = "healthy"
            if grep -q '^COMPOSE_PROFILES=.*tunnel' .env; then
              docker compose logs --tail=30 cloudflared
              test "$(docker inspect --format '{{.State.Running}}' music-cloudflared)" = "true"
            fi
            printf '%s\n' "$env_hash" > "$env_state"
            # Old bot images become untagged after each build; keep the disk tidy.
            docker image prune -f
            if [ "${FULL_REBUILD:-false}" = "true" ]; then
              date +%s > "$full_state"
              docker builder prune -f --filter until=72h
            fi
