name: Deploy Bot to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: "1"
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run tests
        run: npm test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://music.j4fn.site

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          YTDLP_COOKIES_BASE64: ${{ secrets.YTDLP_COOKIES_BASE64 }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: YTDLP_COOKIES_BASE64,CLOUDFLARE_TUNNEL_TOKEN
          command_timeout: 15m
          script_stop: true
          script: |
            set -eu
            cd ~/discord_music_bot
            attempt=1
            until git pull --ff-only origin main; do
              if [ "$attempt" -ge 3 ]; then
                echo "git pull failed after 3 attempts"
                exit 1
              fi
              echo "git pull failed; retrying in 5 seconds..."
              attempt=$((attempt + 1))
              sleep 5
            done
            test -f .env
            chmod 600 .env
            if ! grep -Eq '^ADMIN_TOKEN=.{24,}$' .env; then
              echo "ADMIN_TOKEN must be set to at least 24 characters in the server .env"
              exit 1
            fi
            install -d -m 700 data
            if [ -n "${YTDLP_COOKIES_BASE64:-}" ]; then
              printf '%s' "$YTDLP_COOKIES_BASE64" | base64 --decode > data/cookies.txt
              chmod 600 data/cookies.txt
            fi
            if [ -n "${CLOUDFLARE_TUNNEL_TOKEN:-}" ]; then
              env_tmp="$(mktemp)"
              grep -v -E '^(TUNNEL_TOKEN|COMPOSE_PROFILES|DASHBOARD_BIND_ADDRESS)=' .env > "$env_tmp" || true
              printf '\nTUNNEL_TOKEN=%s\nCOMPOSE_PROFILES=tunnel\nDASHBOARD_BIND_ADDRESS=127.0.0.1\n' "$CLOUDFLARE_TUNNEL_TOKEN" >> "$env_tmp"
              chmod 600 "$env_tmp"
              mv "$env_tmp" .env
            fi
            docker compose up -d --build --remove-orphans
            health="starting"
            for _ in $(seq 1 48); do
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' discord-music-bot 2>/dev/null || true)"
              if [ "$health" = "healthy" ]; then
                break
              fi
              if [ "$health" = "unhealthy" ]; then
                docker compose logs --tail=100 bot
                echo "Bot container became unhealthy"
                exit 1
              fi
              sleep 5
            done
            docker compose ps
            docker compose logs --tail=50 bot
            test "$(docker inspect --format '{{.State.Running}}' discord-music-bot)" = "true"
            test "$health" = "healthy"
            if grep -q '^COMPOSE_PROFILES=.*tunnel' .env; then
              docker compose logs --tail=30 cloudflared
              test "$(docker inspect --format '{{.State.Running}}' music-cloudflared)" = "true"
            fi
